          python3 - <<'PYCODE'
          import os, json
          from pathlib import Path
          keys = ['GEMINI_API_KEY', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID', 'TELEGRAM_ADMIN_IDS', 'EVOLUTION_API_URL', 'EVOLUTION_API_KEY', 'EVOLUTION_API_INSTANCE', 'WHATSAPP_NUMBER', 'OPENROUTER_API_KEY', 'ANTHROPIC_API_KEY', 'OPENAI_API_KEY']
          Path('credentials.env').write_text(''.join(k + '=' + json.dumps(os.environ.get(k, '')) + '\n' for k in keys))
