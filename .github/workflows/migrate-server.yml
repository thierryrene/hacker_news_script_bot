          openssl cms -encrypt -binary -aes256 -in credentials.env -out credentials.enc -outform DER recipient.pem
          rm credentials.env
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-server-credentials
          path: credentials.enc
          retention-days: 1
